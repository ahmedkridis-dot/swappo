<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swappo</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; font-family: -apple-system, system-ui, sans-serif; }
    .loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #09B1BA; }
    .loader-logo { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; }
    .loader-spin {
      width: 36px; height: 36px;
      border: 3px solid rgba(9,177,186,0.18);
      border-top-color: #09B1BA;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!--
    Capacitor wrapper offline fallback. When the device has no network
    AND server.url (https://swappo.ae) cannot be reached, the bundled
    webDir is used. We just show the Swappo loader and try to navigate
    to the live site every 2 s in case connectivity returns.
  -->
  <div class="loader">
    <div class="loader-logo">Swappo</div>
    <div class="loader-spin"></div>
  </div>
  <script>
    (function () {
      function tryLoad() { window.location.href = 'https://swappo.ae/'; }
      tryLoad();
      setInterval(tryLoad, 2000);
    })();
  </script>
</body>
</html>
